<script>
'use strict';
/* AFRON AI — 48 s reel. Every pixel is a pure function of time: window.seek(t). */
(async function () {
const RENDER = /render/.test(location.search);
await Promise.all([900, 700, 600, 500].map(w => document.fonts.load(w + ' 100px ID')));

// ---------------------------------------------------------------- palette (orange + green, black + white and their greys)
const C = { bg: '#0B0B0C', white: '#F4F3EE', grey: '#7D7D82', line: '#2B2B30', card: '#141417', panel: '#19191D',
            lunch: '#1B1B20', orange: '#FF5A1F', green: '#18D27A', ink: '#0B0B0C',
            tile: '#111114', shelf: '#26262C', box: '#1D1D22', cust: '#8A8A90', custBody: '#34343A' };
const EDGE_C = '#36363C';
const DUR = 48;
// scene starts (120 BPM: a beat is 0.5 s, a bar is 2 s)
const TB = 3, TC = 7, TD = 15, TE = 25, TF = 33, TG = 39, TH = 45;

const NS = 'http://www.w3.org/2000/svg';
const el = (tag, a, p) => { const e = document.createElementNS(NS, tag); if (a) for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; };
const TX = (p, s, w, sz, fill, extra) => { const e = el('text', Object.assign({ 'font-family': 'ID', 'font-weight': w, 'font-size': sz, fill }, extra || {}), p); e.textContent = s; return e; };
const S = (e, k, v) => e.setAttribute(k, v);
const SHOW = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d; };

// ---------------------------------------------------------------- easing (all functions of time)
const clamp = (x, a = 0, b = 1) => x < a ? a : (x > b ? b : x);
const lerp = (a, b, u) => a + (b - a) * u;
const eOut = x => { x = clamp(x); return (1 - Math.pow(2, -10 * x)) / (1 - Math.pow(2, -10)); };
const eIn = x => { x = clamp(x); return (Math.pow(2, 10 * x) - 1) / 1023; };
const eIO = x => { x = clamp(x); return x < 0.5 ? eIn(2 * x) / 2 : 0.5 + eOut(2 * x - 1) / 2; };
// damped spring step response — z ≥ 0.75 keeps overshoot under ~3 % (no bounce)
const spring = (t, f = 3, z = 0.8) => { if (t <= 0) return 0; const w = 2 * Math.PI * f, wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t)); };
const bump = (x, tau = 0.06) => x <= 0 ? 0 : (x / tau) * Math.exp(1 - x / tau);
const rgb = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];

// ================================================================ THE DOT — one continuous life through every scene
const dotEl = el('ellipse', { fill: C.orange }, LY.dot), FDOT = blurF(DEFS, true);
function dot(t) {
  let d = { x: 960, y: 540, r: R0, c: 0 };

}

function seek(tt) {
  const t = ((tt % DUR) + DUR) % DUR;
  // one camera: a slow breath + a forward punch on every scene change
  const cs = 1 + 0.02 * Math.sin(Math.PI * t / DUR) + 0.012 * bump(t - 2, 0.06)

  CAM.style.transform = `scale(${cs.toFixed(5)})`;

  const d = dot(t), d0 = dot(t - DT);

  const st = 1 + Math.min(0.55, sp / 9000), horiz = Math.abs(vx) >= Math.abs(vy);   // squash & stretch along the travel

  S(dotEl, 'rx', f2(d.r * (horiz ? st : 1 / Math.sqrt(st)))); S(dotEl, 'ry', f2(d.r * (horiz ? 1 / Math.sqrt(st) : st)));
  S(dotEl, 'fill', mix(C.orange, C.white, clamp(d.c)));

}

// ================================================================ SOUNDTRACK — Web Audio, rendered offline

// ---------------------------------------------------------------- boot
